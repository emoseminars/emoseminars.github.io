name: Build and deploy EMO Talks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          verbose: true

      - name: Verify generated site
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/assets/css/style.css

          test ! -e _site/task_plan.md
          test ! -e _site/findings.md
          test ! -e _site/progress.md
          test ! -e _site/Gemfile
          test ! -e _site/LICENSE.md

          if grep -R -n -E '\{\{|\{%|Your awesome title' _site \
            --include='*.html' --include='*.css'; then
            echo 'Unrendered Liquid or template placeholder found in _site.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

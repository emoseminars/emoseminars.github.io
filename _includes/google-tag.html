{%- assign google_tag_id = site.google_tag_id | default: "" | strip -%}
{%- if jekyll.environment == "production" and google_tag_id != "" -%}
<!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtm.js?id={{ google_tag_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
{%- endif -%}
